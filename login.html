<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Service Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
    <div class="text-center">
      <div class="w-14 h-14 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-2xl mb-3 shadow-md">🔐</div>
      <h1 class="text-xl font-bold text-slate-900">เข้าสู่ระบบการทำงาน</h1>
      <p class="text-xs text-slate-500 mt-1">Service Management System (Default Password: 1234)</p>
    </div>

    {% if error %}
      <div class="bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-lg text-center font-medium">
        ⚠️ {{ error }}
      </div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-4 text-sm">
      <div>
        <label class="block font-medium text-slate-700 mb-1 text-xs">เบอร์โทรศัพท์ประจำตัวผู้ปฏิบัติงาน</label>
        <input type="text" name="phone" required placeholder="เช่น 081-111-1111 หรือ เบอร์ช่าง" class="w-full px-3 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <div>
        <label class="block font-medium text-slate-700 mb-1 text-xs">รหัสผ่าน (Password)</label>
        <input type="password" name="password" required placeholder="••••" class="w-full px-3 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-mono">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition text-sm">
        เข้าสู่ระบบ (Sign In)
      </button>
    </form>
  </div>
</body>
</html>
