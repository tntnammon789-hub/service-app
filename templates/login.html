<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t.login }} - Service Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sarabun', sans-serif !important; }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-lg border border-slate-200 space-y-6">
    <div class="text-center">
      <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-2xl mb-3 shadow-md">🔐</div>
      <h1 class="text-xl font-bold text-slate-900">เข้าสู่ระบบการทำงาน</h1>
      <p class="text-xs text-slate-500 mt-1">Service Management System</p>
    </div>

    {% if error %}
      <div class="bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3.5 rounded-xl text-center font-medium">
        ⚠️ {{ error }}
      </div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-4 text-sm">
      <div>
        <label class="block font-semibold text-slate-700 mb-1 text-xs">เบอร์โทรศัพท์ประจำตัว / ชื่อบัญชี (ID)</label>
        <input type="text" name="phone" required placeholder="กรอกเบอร์โทรศัพท์หรือไอดี" class="w-full px-3.5 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <div>
        <label class="block font-semibold text-slate-700 mb-1 text-xs">รหัสผ่าน (Password)</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-mono">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition text-sm">
        เข้าสู่ระบบ (Sign In)
      </button>
    </form>
  </div>
</body>
</html>
